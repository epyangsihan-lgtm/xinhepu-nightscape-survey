<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="新河浦夜间光景地图：沿着光，重新认识新河浦。" />
  <title>新河浦夜间光景地图</title>
  <link rel="stylesheet" href="assets/vendor/photo-sphere-viewer/photo-sphere-viewer.min.css" />

  <style>
    :root{
      --bg:#0f1519;
      --panel:rgba(17,24,28,.94);
      --panel2:#182126;
      --text:#f5efe5;
      --muted:#aab4b7;
      --line:rgba(255,255,255,.10);
      --gold:#e8b86a;
      --gold2:#ffdaa0;
      --shadow:0 18px 60px rgba(0,0,0,.38);
      --radius:18px;
      --sidebar:350px;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    }
    button,input{font:inherit}
    button{color:inherit}
    #app{position:relative;width:100%;height:100%}
    #map{position:absolute;inset:0;background:#0e1418}

    .topbar{
      position:absolute;z-index:900;left:18px;right:18px;top:18px;height:64px;
      padding:0 18px;display:flex;align-items:center;justify-content:space-between;
      border:1px solid var(--line);border-radius:18px;
      background:rgba(13,19,23,.80);backdrop-filter:blur(18px);box-shadow:var(--shadow)
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{
      width:38px;height:38px;border-radius:12px;position:relative;
      background:radial-gradient(circle at 50% 42%,#ffe0a5 0 8%,#e8b86a 10% 23%,rgba(232,184,106,.18) 25% 60%,transparent 62%);
      border:1px solid rgba(232,184,106,.35)
    }
    .brand-mark:after{
      content:"";position:absolute;left:15px;top:10px;width:8px;height:17px;border-radius:8px 8px 2px 2px;
      background:#efc475;box-shadow:0 0 16px rgba(239,196,117,.85)
    }
    .brand h1{font-size:17px;margin:0;letter-spacing:.08em;font-weight:650}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:11px;letter-spacing:.08em}
    .nav{display:flex;gap:8px}
    .nav button{
      border:0;background:transparent;padding:9px 12px;border-radius:10px;color:#c4cdcf;cursor:pointer;font-size:13px
    }
    .nav button:hover,.nav button.active{background:rgba(255,255,255,.075);color:#fff}

    .sidebar{
      position:absolute;z-index:850;left:18px;top:96px;bottom:18px;width:var(--sidebar);
      display:flex;flex-direction:column;overflow:hidden;
      border:1px solid var(--line);border-radius:var(--radius);
      background:var(--panel);backdrop-filter:blur(20px);box-shadow:var(--shadow)
    }
    .sidebar-toggle{display:none}
    .sidebar-head{padding:18px;border-bottom:1px solid var(--line)}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    .sidebar-title{font-size:22px;line-height:1.25;margin:5px 0;font-family:"Songti SC","Noto Serif SC",serif;font-weight:600}
    .sidebar-desc{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
    .tabbar{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:12px;border-bottom:1px solid var(--line)}
    .tabbar button{
      border:0;background:transparent;padding:9px 4px;border-radius:10px;color:#aeb7b8;cursor:pointer;font-size:12px
    }
    .tabbar button.active{
      color:#fff;background:rgba(232,184,106,.12);box-shadow:inset 0 0 0 1px rgba(232,184,106,.18)
    }
    .panel-content{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
    .panel{display:none;padding:14px}
    .panel.active{display:block}
    .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
    .chip{
      flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 10px;
      background:rgba(255,255,255,.025);color:#b7c0c1;cursor:pointer;font-size:11px
    }
    .chip.active,.chip:hover{background:var(--gold);border-color:var(--gold);color:#171d20}

    .node-list{display:grid;gap:10px}
    .node-card,.route-card,.layer-card{
      border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.028)
    }
    .node-card{
      display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px;cursor:pointer;transition:.2s ease
    }
    .node-card:hover,.node-card.active{
      transform:translateY(-1px);border-color:rgba(232,184,106,.42);background:rgba(232,184,106,.065)
    }
    .node-thumb{width:86px;height:78px;border-radius:10px;overflow:hidden;background:#202a2f}
    .node-thumb svg{width:100%;height:100%;display:block}
    .node-meta h3{margin:2px 0 4px;font-size:14px}
    .node-meta p{
      margin:0;color:var(--muted);font-size:11px;line-height:1.55;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
    }
    .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .tag{padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:#bdc5c6;font-size:9px}

    .route-card,.layer-card{padding:14px;margin-bottom:10px}
    .route-card{cursor:pointer;transition:.2s}
    .route-card:hover,.route-card.active{border-color:rgba(232,184,106,.4);background:rgba(232,184,106,.06)}
    .route-top,.layer-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .route-card h3,.layer-card h3{margin:0;font-size:14px}
    .route-card p,.layer-card p{margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.6}
    .route-stats{margin-top:10px;display:flex;gap:12px;color:#d7c19e;font-size:10px}
    .toggle{position:relative;flex:none;width:40px;height:22px;border-radius:999px;background:#354045;cursor:pointer}
    .toggle:after{
      content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#cbd1d2;transition:.2s
    }
    .toggle.active{background:var(--gold)}
    .toggle.active:after{transform:translateX(18px);background:#192024}

    .detail{
      position:absolute;z-index:880;right:18px;top:96px;bottom:18px;width:min(410px,calc(100vw - 36px));
      transform:translateX(calc(100% + 32px));transition:transform .34s cubic-bezier(.2,.85,.25,1);
      border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
      background:rgba(17,24,28,.97);backdrop-filter:blur(20px);box-shadow:var(--shadow)
    }
    .detail.open{transform:translateX(0)}
    .detail-scroll{height:100%;overflow:auto;padding-bottom:20px}
    .hero{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#263136}
    .hero svg,.hero img{width:100%;height:100%;display:block}
    .hero img{object-fit:cover}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,18,21,.92) 0,transparent 58%)}
    .close{
      position:absolute;z-index:3;right:12px;top:12px;width:34px;height:34px;border-radius:50%;
      border:1px solid rgba(255,255,255,.15);background:rgba(8,13,15,.65);cursor:pointer;font-size:18px
    }
    .hero-caption{position:absolute;z-index:2;left:18px;right:18px;bottom:16px}
    .hero-caption h2{margin:5px 0 0;font-size:25px;font-family:"Songti SC","Noto Serif SC",serif}
    .body{padding:18px}
    .lead{margin:0;color:#e8e2d8;line-height:1.8;font-size:13px}
    .lead:empty,.tags:empty{display:none}
    .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
    .fact{padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}
    .fact b{display:block;margin-bottom:3px;color:var(--gold2);font-size:12px}
    .fact span{color:var(--muted);font-size:9px}
    .section{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
    .section h3{margin:0 0 8px;color:var(--gold2);font-size:13px}
    .section p{margin:0;color:#bdc6c7;font-size:12px;line-height:1.8}
    .section p:empty{display:none}
    .primary{
      width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;
      background:var(--gold);color:#171d20;cursor:pointer;font-weight:700;font-size:16px
    }
    .secondary{
      width:100%;margin-top:9px;padding:12px;border:1px solid var(--line);border-radius:12px;
      background:rgba(255,255,255,.04);color:#d9dedc;cursor:pointer;font-size:15px
    }

    .research-modal{
      position:fixed;z-index:1500;inset:0;display:none;place-items:center;padding:10px;
      background:rgba(5,9,11,.80);backdrop-filter:blur(8px)
    }
    .research-modal.open{display:grid}
    .research-card{
      position:relative;width:min(1280px,calc(100vw - 20px));max-height:calc(100vh - 20px);
      overflow:auto;border:1px solid rgba(255,255,255,.15);border-radius:20px;
      background:#131c20;box-shadow:var(--shadow)
    }
    .research-head{padding:14px 56px 12px 22px;border-bottom:1px solid var(--line)}
    .research-head h2{margin:0;font-size:24px;font-family:"Songti SC","Noto Serif SC",serif}
    .modal-close{position:absolute;right:16px;top:16px;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.05);cursor:pointer;font-size:19px}
    .research-progress{display:flex;gap:8px;margin-top:8px}
    .research-step{display:flex;align-items:center;gap:6px;color:#829093;font-size:11px}
    .research-step i{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;font-style:normal;background:#344045;color:#d8dddd}
    .research-step.active,.research-step.done{color:var(--gold2)}
    .research-step.active i,.research-step.done i{background:var(--gold);color:#182024}
    .research-body{padding:18px 22px 22px}
    .pano-stage{position:relative}
    .pano-viewer{height:clamp(420px,calc(100vh - 250px),760px);border-radius:14px;overflow:hidden;background:#0b1215;border:1px solid var(--line)}
    .pano-viewer iframe,.pano-viewer #panoViewer{width:100%;height:100%;border:0}
    .pano-loading{
      position:absolute;z-index:11;inset:0;display:grid;place-items:center;border-radius:14px;
      background:radial-gradient(circle at center,rgba(31,47,52,.72),rgba(8,14,17,.92));
      color:#f5efe5;transition:opacity .25s,visibility .25s;pointer-events:none
    }
    .pano-loading.hidden{opacity:0;visibility:hidden}
    .pano-loading-inner{width:min(280px,70%);text-align:center}
    .pano-loading strong{display:block;margin-bottom:9px;font-size:13px;font-weight:500}
    .pano-loading-track{height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
    .pano-loading-bar{display:block;width:4%;height:100%;border-radius:inherit;background:var(--gold);transition:width .2s}
    .pano-scene-badge{
      position:absolute;z-index:12;right:12px;top:12px;padding:7px 11px;border:1px solid rgba(255,255,255,.22);
      border-radius:999px;background:rgba(9,15,18,.72);backdrop-filter:blur(8px);color:#fff;font-size:11px;pointer-events:none
    }
    .ground-nav{
      position:absolute;z-index:12;left:50%;bottom:58px;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none
    }
    .ground-arrow{
      width:58px;height:66px;padding:0;border:0;clip-path:polygon(50% 0,100% 43%,73% 43%,73% 100%,27% 100%,27% 43%,0 43%);
      background:rgba(255,255,255,.88);filter:drop-shadow(0 4px 5px rgba(0,0,0,.55));cursor:pointer;pointer-events:auto;
      transform:perspective(150px) rotateX(54deg);transition:opacity .2s,background .2s,filter .2s
    }
    .ground-arrow:hover{background:var(--gold2);filter:drop-shadow(0 4px 8px rgba(0,0,0,.75))}
    .ground-arrow.prev{transform:perspective(150px) rotateX(54deg) rotate(180deg)}
    .ground-arrow:disabled{opacity:.22;cursor:not-allowed;pointer-events:none}
    .pano-help{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
    .survey-form{display:grid;gap:20px}
    .survey-intro{margin:0;color:#bdc6c7;font-size:13px;line-height:1.75}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field label,.question legend{display:block;margin-bottom:7px;color:#e8e2d8;font-size:12px}
    .field input,.field select,.field textarea{
      width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#0e1518;color:#f5efe5;outline:none
    }
    .field textarea{min-height:76px;resize:vertical}
    .question{margin:0;padding:0;border:0}
    .likert{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .likert label{position:relative;padding:9px 3px;border:1px solid var(--line);border-radius:9px;text-align:center;color:#aeb9ba;cursor:pointer;font-size:11px}
    .likert input{position:absolute;opacity:0;pointer-events:none}
    .likert label:has(input:checked){border-color:var(--gold);background:rgba(232,184,106,.15);color:var(--gold2)}
    .survey-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
    .survey-actions button{width:auto;margin:0;padding:11px 18px}
    .thanks{text-align:center;padding:34px 10px 18px}.thanks h3{margin:0;color:var(--gold2);font-size:22px}.thanks p{color:var(--muted);font-size:13px;line-height:1.7}
    @media(max-width:560px){
      .pano-viewer{height:clamp(430px,62dvh,590px)}
      .ground-nav{bottom:52px}.ground-arrow{width:48px;height:56px}
      .form-grid{grid-template-columns:1fr}.research-head{padding-left:18px}.research-body{padding:12px}
      .pano-help{margin-top:8px;line-height:1.5}.research-body>.primary{margin-top:12px}
      .likert{gap:4px}.likert label{font-size:10px;padding:8px 1px}
    }

    .intro{
      position:absolute;z-index:1100;inset:0;display:grid;place-items:center;
      background:radial-gradient(circle at 62% 42%,rgba(232,184,106,.12),transparent 25%),rgba(8,12,14,.86);
      backdrop-filter:blur(7px);transition:.35s
    }
    .intro.hidden{opacity:0;visibility:hidden}
    .intro-card{
      width:min(640px,calc(100vw - 36px));padding:42px;border:1px solid rgba(255,255,255,.13);
      border-radius:24px;background:rgba(20,27,31,.88);box-shadow:var(--shadow);text-align:center
    }
    .intro-symbol{
      width:76px;height:76px;margin:0 auto 18px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,218,156,.95) 0 6%,rgba(232,184,106,.58) 8% 20%,rgba(232,184,106,.12) 22% 54%,transparent 56%)
    }
    .intro h2{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:.08em;font-family:"Songti SC","Noto Serif SC",serif;font-weight:500}
    .intro .sub{margin:9px 0 0;color:var(--gold);letter-spacing:.32em;font-size:12px}
    .intro p{max-width:500px;margin:22px auto;color:var(--muted);line-height:1.9;font-size:13px}
    .intro button{
      min-width:180px;padding:12px 20px;border:0;border-radius:999px;background:var(--gold);color:#171c1e;cursor:pointer;font-weight:650
    }

    .map-error{
      position:absolute;z-index:1050;left:50%;top:50%;transform:translate(-50%,-50%);
      width:min(520px,calc(100vw - 36px));padding:24px;border:1px solid rgba(232,184,106,.25);
      border-radius:18px;background:rgba(17,24,28,.96);box-shadow:var(--shadow);display:none
    }
    .map-error.show{display:block}
    .map-error h3{margin:0 0 8px;color:var(--gold2)}
    .map-error p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.7}
    .map-error input{
      width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
      background:#10171b;color:#fff;outline:none
    }
    .map-error button{
      margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:var(--gold);color:#171d20;cursor:pointer;font-weight:650
    }

    .custom-marker{position:relative;width:32px;height:32px;overflow:visible}
    .custom-marker .core{
      position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;
      background:var(--gold);border:2px solid rgba(255,255,255,.85);box-shadow:0 0 14px rgba(232,184,106,.95)
    }
    .custom-marker .marker-label{
      position:absolute;left:50%;bottom:31px;transform:translateX(-50%);white-space:nowrap;
      padding:4px 7px;border:1px solid var(--gold);border-radius:4px;background:rgba(14,21,24,.94);
      color:var(--gold2);font-size:12px;font-weight:650;line-height:1.2;letter-spacing:.03em;
      box-shadow:0 3px 10px rgba(0,0,0,.38);pointer-events:none
    }

    @media(max-width:860px){
      .nav button:not(.keep){display:none}
      .sidebar{left:12px;right:12px;bottom:12px;top:auto;width:auto;height:48vh;backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .28s ease,opacity .2s ease}
      .sidebar.collapsed{transform:translateY(calc(100% + 24px));opacity:0;pointer-events:none}
      .sidebar.collapsed + .sidebar-toggle{
        position:absolute;z-index:851;left:50%;bottom:14px;display:grid;place-items:center;width:46px;height:30px;
        transform:translateX(-50%);border:1px solid rgba(232,184,106,.7);border-radius:15px 15px 7px 7px;
        background:rgba(16,23,27,.94);color:var(--gold2);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.34)
      }
      .topbar{left:12px;right:12px;top:12px;backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.24)}
      .detail{top:88px;right:12px;bottom:12px;backdrop-filter:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
      .custom-marker .core{box-shadow:0 0 7px rgba(232,184,106,.72)}
      .custom-marker .marker-label{bottom:29px;padding:3px 5px;font-size:10px}
    }
    @media(max-width:520px){
      .topbar{height:58px;padding:0 12px}
      .brand p{display:none}
      .brand h1{font-size:14px}
      .brand-mark{width:34px;height:34px}
      .sidebar-head{display:none}
      .sidebar{height:52vh}
      .node-card{grid-template-columns:76px 1fr}
      .node-thumb{width:76px}
      .detail{width:calc(100vw - 24px)}
      .intro-card{padding:30px 20px}
    }
  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>新河浦夜间光景地图</h1>
        <p>沿着光，重新认识历史街区</p>
      </div>
    </div>
    <nav class="nav">
      <button class="active">光景地图</button>
      <button onclick="switchPanel('routes')">推荐路线</button>
      <button class="keep" onclick="showAbout()">关于项目</button>
    </nav>
  </header>

  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="eyebrow">Nightscape Explorer</div>
      <h2 class="sidebar-title">今晚，在新河浦看什么？</h2>
      <p class="sidebar-desc">从洋楼门廊、街巷树影到社区生活微光，选择一个节点开始夜间漫游。</p>
    </div>
    <div class="tabbar">
      <button data-panel="nodes" class="active">光景节点</button>
      <button data-panel="routes">漫游路线</button>
    </div>
    <div class="panel-content">
      <section id="nodes-panel" class="panel active">
        <div class="filter-row" id="filters"></div>
        <div class="node-list" id="nodeList"></div>
      </section>
      <section id="routes-panel" class="panel"><div id="routeList"></div></section>
    </div>
  </aside>
  <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="展开光景节点面板" title="展开光景节点面板" onclick="setSidebarCollapsed(false)">⌃</button>

  <aside class="detail" id="detail">
    <div class="detail-scroll">
      <div class="hero" id="hero">
        <button class="close" onclick="closeDetail()">×</button>
        <div class="hero-caption">
          <div class="eyebrow" id="detailCategory"></div>
          <h2 id="detailTitle"></h2>
        </div>
      </div>
      <div class="body">
        <div class="facts">
          <div class="fact"><b id="detailTime"></b><span>推荐时段</span></div>
          <div class="fact"><b id="detailStay"></b><span>活动</span></div>
          <div class="fact"><b id="detailLevel"></b><span>节点类型</span></div>
        </div>
        <div class="section"><h3>这里有什么</h3><p id="detailLook"></p></div>
        <button class="primary" id="researchBtn">进入全景浏览与调研问卷</button>
        <button class="secondary" id="focusBtn">在地图上定位</button>
      </div>
    </div>
  </aside>

  <div class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-symbol"></div>
      <h2>新河浦夜间光景地图</h2>
      <div class="sub">沿着光，重新认识新河浦</div>
      <p>光重新勾勒了建筑、街巷、树木与生活。<br>感受每一处值得停留的夜色。</p>
      <button onclick="enterMap()">开始夜间漫游</button>
    </div>

        bubble:false
      });
      marker.on("click",()=>openNode(node.id));
      markerMap.set(node.id,marker);
    });
    refreshMarkers();
  }

  function refreshMarkers(){
    if(!map) return;
    map.remove([...markerMap.values()]);
    const visible=nodes.filter(n=>currentCategory==="全部"||n.category===currentCategory)
      .map(n=>markerMap.get(n.id));
    map.add(visible);
  }

  function renderAll(){
    renderFilters();
    renderNodes();
    renderRoutes();
  }

  function renderFilters(){
    const el=document.getElementById("filters");
    el.innerHTML='<button class="chip active" data-category="全部">全部</button>';
  }

  function renderNodes(){
    const visible=nodes.filter(n=>currentCategory==="全部"||n.category===currentCategory);
    document.getElementById("nodeList").innerHTML=visible.map(n=>`
      <article class="node-card ${activeNode===n.id?"active":""}" data-id="${n.id}">
        <div class="node-thumb">${sceneSvg(n.scene,n.name)}</div>
        <div class="node-meta">
          <h3>${n.name}</h3><p>${n.summary}</p>
          <div class="tags">${n.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        </div>
      </article>`).join("");
    document.querySelectorAll(".node-card").forEach(card=>card.onclick=()=>openNode(card.dataset.id));
  }

  function renderRoutes(){
    document.getElementById("routeList").innerHTML=routes.map(r=>`
      <article class="route-card" data-route="${r.id}">
        <div class="route-top"><h3>${r.name}</h3><span style="color:var(--gold)">→</span></div>
        <p>${r.desc}</p>
        <div class="route-stats"><span>${r.duration}</span><span>${r.distance}</span><span>${r.nodes.length}个节点</span></div>
      </article>`).join("");
    document.querySelectorAll(".route-card").forEach(card=>card.onclick=()=>showRoute(card.dataset.route));
  }

  function openNode(id){
    const node=nodes.find(n=>n.id===id); if(!node) return;
    activeNode=id;renderNodes();
    const hero=document.getElementById("hero");
    hero.querySelectorAll(":scope>svg,:scope>img").forEach(s=>s.remove());
    if(node.heroImage){
      const image=document.createElement("img");
      image.src=node.heroImage;image.alt=`${node.name}头图`;
      hero.prepend(image);
    }else hero.insertAdjacentHTML("afterbegin",sceneSvg(node.scene,node.name));
    const category=document.getElementById("detailCategory");
    category.textContent=node.category||"";
    category.hidden=!node.category;
    document.getElementById("detailTitle").textContent=node.name;
    document.getElementById("detailTime").textContent=node.time;
    document.getElementById("detailStay").textContent=node.stay;
    document.getElementById("detailLevel").textContent=node.level;
    document.getElementById("detailLook").textContent=node.look;
    document.getElementById("focusBtn").onclick=()=>map&&map.setZoomAndCenter(18,[node.lng,node.lat]);
    document.getElementById("researchBtn").onclick=()=>startResearch(node.id);
    document.getElementById("detail").classList.add("open");
    if(map) map.setZoomAndCenter(17.5,[node.lng,node.lat]);
  }

  function isMobileLayout(){
    return window.matchMedia("(max-width: 860px)").matches;
  }

  function setSidebarCollapsed(collapsed){
    document.querySelector(".sidebar").classList.toggle("collapsed",collapsed);
  }

  function closeDetail(){
    activeNode=null;renderNodes();document.getElementById("detail").classList.remove("open");
  }

  async function startResearch(id){
    const node=nodes.find(n=>n.id===id); if(!node) return;
    destroyPanoViewer();
    researchNode=node;
    currentPanoramaSceneIndex=0;
    document.getElementById("researchTitle").textContent=node.name;
    setResearchStep("pano");
    document.getElementById("researchBody").innerHTML=`
      <div class="pano-stage">
        <div class="pano-viewer"><div id="panoViewer" aria-label="${node.name}全景图"></div></div>
        <div class="pano-loading" id="panoLoading" aria-live="polite">
          <div class="pano-loading-inner">
            <strong id="panoLoadingText">正在加载全景…</strong>
            <div class="pano-loading-track"><span class="pano-loading-bar" id="panoLoadingBar"></span></div>
          </div>
        </div>
        <div class="pano-scene-badge" id="panoSceneBadge"></div>
        <div class="ground-nav" id="groundNav">
          <button class="ground-arrow next" id="panoNext" type="button" onclick="switchPanoramaScene(1)" aria-label="进入下一张全景" title="进入下一张全景"></button>
          <button class="ground-arrow prev" id="panoPrev" type="button" onclick="switchPanoramaScene(-1)" aria-label="退回上一张全景" title="退回上一张全景"></button>
        </div>
      </div>
      <p class="pano-help">拖动图片可以进行360°环视，点击箭头浏览下一张图像</p>
      <button class="primary" onclick="openWjxSurvey()">漫游完毕，回答问卷</button>`;
    document.getElementById("researchModal").classList.add("open");
    updatePanoramaNavigation(node);
    try{
      await ensureLocalPanoramaReadable(node);
      renderPanorama(node);
    }catch(error){
      console.error(error);
      const container=document.getElementById("panoViewer");
      if(container) container.innerHTML='<p style="padding:24px;color:#f5efe5;line-height:1.8">全景图片读取失败。请确认网页旁的 assets 文件夹完整，或通过本地服务器打开网页。</p>';
    }
  }

  function ensureLocalPanoramaReadable(node){
    const embedded=window.XINHEPU_EMBEDDED_PANOS&&window.XINHEPU_EMBEDDED_PANOS[node.id];
    const scriptPath=EMBEDDED_PANORAMA_SCRIPTS[node.id];
    if(location.protocol!=="file:"||embedded||!scriptPath) return Promise.resolve();
    return new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=scriptPath;
      script.dataset.panoramaData=node.id;
      script.onload=()=>resolve();
      script.onerror=()=>{script.remove();reject(new Error(`无法载入本地全景数据：${scriptPath}`))};
      document.head.appendChild(script);
    });
  }

  function renderPanorama(node){
    requestAnimationFrame(()=>{
      const container=document.getElementById("panoViewer");
      if(!container) return;
      if(!window.PhotoSphereViewer){
        container.innerHTML='<p style="padding:24px;color:#f5efe5">全景播放器加载失败，请确认 assets/vendor 文件夹完整。</p>';
        return;
      }
      const embedded=window.XINHEPU_EMBEDDED_PANOS&&window.XINHEPU_EMBEDDED_PANOS[node.id];
      const scene=getCurrentPanoramaScene(node);
      const panoramaSource=embedded||getOptimizedPanoramaUrl(scene.panoramaUrl||node.panoramaUrl);
      showPanoramaLoading(4);
      activePanoViewer=new PhotoSphereViewer.Viewer({
        container,panorama:panoramaSource,
        navbar:["autorotate","zoom","fullscreen"],
        mousewheel:true,mousemove:true,
        minFov:30,maxFov:92,defaultZoomLvl:18,autorotateZoomLvl:18,
        autorotateDelay:800,autorotateIdle:true,autorotateSpeed:"0.65rpm",
        defaultLong:scene.longitude||0
      });
      activePanoViewer.on("load-progress",(...args)=>{
        const progress=[...args].reverse().find(value=>typeof value==="number");
        if(Number.isFinite(progress)) showPanoramaLoading(progress);
      });
      const onPanoramaReady=()=>{
        hidePanoramaLoading();
        preloadAdjacentPanorama(node);
      };
      activePanoViewer.on("ready",onPanoramaReady);
      activePanoViewer.on("panorama-loaded",onPanoramaReady);
    });
  }

  function browserSupportsWebP(){
    try{
      const canvas=document.createElement("canvas");
      canvas.width=canvas.height=1;
      return canvas.toDataURL("image/webp").startsWith("data:image/webp");
    }catch(error){return false}
  }

  const panoramaWebpSupported=browserSupportsWebP();
  const panoramaConnection=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  const useMobilePanorama=window.matchMedia("(max-width: 820px)").matches||
    Math.min(window.screen.width,window.screen.height)<=820||
    Boolean(panoramaConnection&&(/2g/.test(panoramaConnection.effectiveType||"")||panoramaConnection.saveData));
  const preloadedPanoramas=new Map();

  function getOptimizedPanoramaUrl(url){
    if(!panoramaWebpSupported||!/^assets\/panoramas\/.+\.jpg(?:\?.*)?$/i.test(url||"")) return url;
    const suffix=useMobilePanorama?"_mobile.webp":"_desktop.webp";
    return url.replace(/\.jpg(?=\?|$)/i,suffix);
  }

  function showPanoramaLoading(progress=4){
    const loading=document.getElementById("panoLoading");
    const bar=document.getElementById("panoLoadingBar");
    const text=document.getElementById("panoLoadingText");
    if(loading) loading.classList.remove("hidden");
    if(bar) bar.style.width=`${Math.max(4,Math.min(100,Math.round(progress)))}%`;
    if(text) text.textContent="正在加载全景…";
  }

  function hidePanoramaLoading(){
    const loading=document.getElementById("panoLoading");
    if(loading) loading.classList.add("hidden");
  }

  function preloadAdjacentPanorama(node){
    if(panoramaConnection&&panoramaConnection.saveData) return;
    const tour=getPanoramaTour(node);
    const next=tour[currentPanoramaSceneIndex+1];
    if(!next) return;
    const url=getOptimizedPanoramaUrl(next.panoramaUrl||node.panoramaUrl);
    if(!url||preloadedPanoramas.has(url)) return;
    const preload=()=>{
      const image=new Image();
      image.decoding="async";
      image.src=url;
      preloadedPanoramas.set(url,image);
    };
    if("requestIdleCallback" in window) requestIdleCallback(preload,{timeout:1800});
    else setTimeout(preload,600);
  }

  function getPanoramaTour(node){
    return PANORAMA_TOURS[node.id]||[{label:node.name,panoramaUrl:node.panoramaUrl,longitude:0}];
  }

  function getCurrentPanoramaScene(node){
    const tour=getPanoramaTour(node);
    return tour[Math.min(currentPanoramaSceneIndex,tour.length-1)];
  }

  function updatePanoramaNavigation(node){
    const tour=getPanoramaTour(node);
    const badge=document.getElementById("panoSceneBadge");
    const nav=document.getElementById("groundNav");
    const prev=document.getElementById("panoPrev");
    const next=document.getElementById("panoNext");
    if(badge) badge.textContent=`${currentPanoramaSceneIndex+1} / ${tour.length}`;
    if(nav) nav.hidden=tour.length<2;
    if(prev) prev.disabled=currentPanoramaSceneIndex===0;
    if(next) next.disabled=currentPanoramaSceneIndex===tour.length-1;
  }

  async function switchPanoramaScene(direction){
    if(!researchNode) return;
    const tour=getPanoramaTour(researchNode);
    const target=Math.max(0,Math.min(tour.length-1,currentPanoramaSceneIndex+direction));
    if(target===currentPanoramaSceneIndex) return;
    currentPanoramaSceneIndex=target;
    updatePanoramaNavigation(researchNode);
    const scene=getCurrentPanoramaScene(researchNode);
    const source=getOptimizedPanoramaUrl(scene.panoramaUrl||researchNode.panoramaUrl);
    if(activePanoViewer&&typeof activePanoViewer.setPanorama==="function"){
      showPanoramaLoading(4);
      try{
        await activePanoViewer.setPanorama(source,{longitude:scene.longitude||0},false);
        hidePanoramaLoading();
        preloadAdjacentPanorama(researchNode);
        return;
      }catch(error){console.warn("优化全景切换失败，尝试重新载入。",error)}
    }
    destroyPanoViewer();
    renderPanorama(researchNode);
  }

  function destroyPanoViewer(){
    if(activePanoViewer&&typeof activePanoViewer.destroy==="function") activePanoViewer.destroy();
    activePanoViewer=null;
  }

  function openWjxSurvey(){
    setResearchStep("survey");
    const surveyWindow=window.open(WJX_SURVEY_URL,"_blank");
    if(surveyWindow){
      surveyWindow.opener=null;
    }else{
      window.location.href=WJX_SURVEY_URL;
    }
  }

  function setResearchStep(stage){
    const order={pano:1,survey:2,done:3};
    [["panoStep",1],["surveyStep",2],["doneStep",3]].forEach(([id,num])=>{
      const el=document.getElementById(id);
      el.classList.toggle("active",num===order[stage]);
      el.classList.toggle("done",num<order[stage]);
    });
  }

  function showSurvey(){
    if(!researchNode) return;
    destroyPanoViewer();
    setResearchStep("survey");
    const questions=[
      ["brightness","这个场景的整体明亮程度如何？","很暗","较暗","适中","较亮","很亮"],
      ["comfort","这个场景的光环境让我感到舒适。","非常不同意","不同意","一般","同意","非常同意"],
      ["safety","这个场景使我感到夜间步行是安全的。","非常不同意","不同意","一般","同意","非常同意"],
      ["character","这个场景体现了新河浦的历史与场所特色。","非常不同意","不同意","一般","同意","非常同意"],
      ["stay","我愿意在这里停留、散步或再次到访。","非常不同意","不同意","一般","同意","非常同意"]
    ];
    const questionHtml=questions.map(([key,title,...labels])=>`
      <fieldset class="question"><legend>${title}</legend><div class="likert">
        ${labels.map((label,index)=>`<label><input required type="radio" name="${key}" value="${index+1}"><span>${label}</span></label>`).join("")}
      </div></fieldset>`).join("");
    document.getElementById("researchBody").innerHTML=`
      <form class="survey-form" id="surveyForm">
        <p class="survey-intro">请依据刚才的全景浏览体验作答。除“受访者编号”外，其余为必答项；本模板不会收集姓名、电话等直接身份信息。</p>
        <div class="form-grid">
          <div class="field"><label>受访者编号（选填）</label><input name="participantCode" maxlength="30" placeholder="如：P001" /></div>
          <div class="field"><label>你对新河浦的熟悉程度</label><select name="familiarity" required><option value="" disabled selected>请选择</option><option>从未来过</option><option>偶尔来访</option><option>比较熟悉</option><option>非常熟悉</option></select></div>
        </div>
        ${questionHtml}
        <div class="field"><label>请用一句话描述最吸引你或最需要改善的光景元素（选填）</label><textarea name="comment" maxlength="500" placeholder="例如：树影很有氛围，但人行道局部偏暗。"></textarea></div>
        <div class="survey-actions"><button type="button" class="secondary" onclick="startResearch(researchNode.id)">返回全景</button><button type="submit" class="primary">提交本点问卷</button></div>
      </form>`;
    document.getElementById("surveyForm").onsubmit=submitSurvey;
  }

  function submitSurvey(event){
    event.preventDefault();
    const form=event.currentTarget;
    if(!form.reportValidity()||!researchNode) return;
    const data=Object.fromEntries(new FormData(form).entries());
    const responses=JSON.parse(localStorage.getItem("xinhepu_survey_responses")||"[]");
    responses.push({
      responseId:`R${Date.now()}`,
      submittedAt:new Date().toISOString(),
      nodeId:researchNode.id,nodeName:researchNode.name,nodeCategory:researchNode.category,
      ...data
    });
    localStorage.setItem("xinhepu_survey_responses",JSON.stringify(responses));
    setResearchStep("done");
    document.getElementById("researchBody").innerHTML=`
      <div class="thanks"><h3>感谢你的回答</h3><p>这份问卷已保存在本浏览器中。当前已累计 ${responses.length} 份有效样本。</p>
      <button class="primary" onclick="closeResearch()">返回地图</button></div>`;
  }

  function exportSurveyData(){
    const responses=JSON.parse(localStorage.getItem("xinhepu_survey_responses")||"[]");
    if(!responses.length){alert("当前浏览器还没有问卷数据。");return}
    const headers=["responseId","submittedAt","nodeId","nodeName","nodeCategory","participantCode","familiarity","brightness","comfort","safety","character","stay","comment"];
    const escapeCsv=value=>`"${String(value??"").replaceAll('"','""')}"`;
    const csv="\uFEFF"+[headers.join(","),...responses.map(r=>headers.map(key=>escapeCsv(r[key])).join(","))].join("\n");
    const link=document.createElement("a");
    link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    link.download=`新河浦夜间光景问卷_${new Date().toLocaleDateString("zh-CN").replaceAll("/","-")}.csv`;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  }

  function closeResearch(){
    destroyPanoViewer();
    document.getElementById("researchModal").classList.remove("open");
    researchNode=null;
  }

  function showRoute(id){
    if(!map) return;
    routeOverlays.forEach(o=>map.remove(o)); routeOverlays=[];
    const route=routes.find(r=>r.id===id); if(!route) return;
    const routeNodes=route.nodes.map(x=>nodes.find(n=>n.id===x)).filter(Boolean);
    const path=routeNodes.map(n=>[n.lng,n.lat]);

    const line=new AMap.Polyline({
      path,strokeColor:"#e8b86a",strokeOpacity:.9,strokeWeight:5,strokeStyle:"dashed",strokeDasharray:[6,8],zIndex:80
    });
    routeOverlays.push(line); map.add(line);

    routeNodes.forEach((n,i)=>{
      const content=document.createElement("div");
      content.style.cssText="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e8b86a;color:#162024;border:1px solid #fff;font-size:11px;font-weight:700";
      content.textContent=String(i+1);
      const m=new AMap.Marker({position:[n.lng,n.lat],content,offset:new AMap.Pixel(-12,-12),zIndex:160});
      routeOverlays.push(m);map.add(m);
    });
    map.setFitView(routeOverlays,false,[80,80,80,380]);
  }

  function switchPanel(name){
    document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("active",b.dataset.panel===name));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(`${name}-panel`).classList.add("active");
  }
  document.querySelectorAll(".tabbar button").forEach(btn=>btn.onclick=()=>switchPanel(btn.dataset.panel));

  function enterMap(){document.getElementById("intro").classList.add("hidden");setTimeout(()=>map&&map.resize(),350)}
  function showAbout(){document.getElementById("intro").classList.remove("hidden")}
  function showMapError(){document.getElementById("mapError").classList.add("show")}
  function saveSecurityCode(){
    const v=document.getElementById("securityInput").value.trim();
    if(!v){alert("请先粘贴 securityJsCode");return}
    localStorage.setItem("xinhepu_amap_security_code",v);
    location.reload();
  }

  window.openNode=openNode;
  window.closeDetail=closeDetail;
  window.switchPanel=switchPanel;
  window.enterMap=enterMap;
  window.showAbout=showAbout;
  window.saveSecurityCode=saveSecurityCode;
  window.startResearch=startResearch;
  window.switchPanoramaScene=switchPanoramaScene;
  window.openWjxSurvey=openWjxSurvey;
  window.showSurvey=showSurvey;
  window.closeResearch=closeResearch;
  window.exportSurveyData=exportSurveyData;

  loadAmap();
</script>
</body>
</html>
